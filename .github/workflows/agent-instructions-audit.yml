# Agent instructions audit: a pipeline that audits a repository's agent
# instructions, CLAUDE.md and README.md.
#
# Each run, if the base branch moved since the caller workflow's last
# successful run: Claude works through the checks in
# actions/agent-instructions-audit/checks.md, editing the files or writing
# questions. Edits become a PR, with the questions in its body; questions
# alone become an issue. One PR or issue at a time: while one is open, the
# run skips. A run that is not on a schedule always audits.
#
# The caller repository needs the CLAUDE_CODE_OAUTH_TOKEN secret (from
# `claude setup-token`) and, under Settings > Actions > General, "Allow
# GitHub Actions to create and approve pull requests". See README.md.
#
# Steps that need files of this repository run them through the composite
# action actions/agent-instructions-audit, at the same tag as this pipeline:
# inside a reusable workflow, the checkout and ./ paths are the caller's.

name: Agent instructions audit

on:
  workflow_call:
    inputs:
      extra-instructions:
        description: >-
          Text appended to Claude's prompt: what Claude should know about this
          repository to apply the checks (issue ID prefix, where the tests and
          design docs are, files that are absent on purpose).
        type: string
        required: false
        default: ""
      base-branch:
        description: The branch the audit reads and its PR targets.
        type: string
        required: false
        default: main
      pr-branch:
        description: >-
          The branch the fixes are pushed to and the PR is opened from. While a
          PR from it is open, the audit skips.
        type: string
        required: false
        default: agent-instructions-audit
      workflow-file:
        description: >-
          The caller workflow's file name, e.g. agent-instructions-audit.yml.
          Its last successful run is the baseline for "moved since". Empty
          means the one in github.workflow_ref, which in a called workflow
          names the caller.
        type: string
        required: false
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: Claude Code OAuth token, from `claude setup-token`.
        required: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A called workflow can only narrow the caller's permissions: the caller
    # must grant at least these.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ${{ inputs.pr-branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base-branch }}
          fetch-depth: 0

      - name: Skip unless the base branch moved
        id: gate
        uses: xpmatteo/agbredo-pipelines/actions/agent-instructions-audit@v2
        with:
          step: gate
          branch: ${{ env.BRANCH }}
          base-branch: ${{ inputs.base-branch }}
          workflow-file: ${{ inputs.workflow-file || github.workflow_ref }}

      - name: Gather facts for Claude
        if: steps.gate.outputs.skip == 'false'
        uses: xpmatteo/agbredo-pipelines/actions/agent-instructions-audit@v2
        with:
          step: facts

      - name: Build Claude's prompt
        id: prompt
        if: steps.gate.outputs.skip == 'false'
        uses: xpmatteo/agbredo-pipelines/actions/agent-instructions-audit@v2
        with:
          step: prompt
          extra-instructions: ${{ inputs.extra-instructions }}

      # Claude Code sends this GitHub OIDC token with its telemetry, so that
      # Agbredo knows the run comes from this pipeline. We get it here,
      # because claude-code-action hides the OIDC variables from Claude.
      # The token expires in minutes; Agbredo accepts it for the whole job.
      - name: Get a telemetry token
        if: steps.gate.outputs.skip == 'false'
        run: |
          token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=agbredo" | jq -r .value)
          echo "::add-mask::$token"
          echo "OTEL_EXPORTER_OTLP_HEADERS=Authorization=Bearer $token" >> "$GITHUB_ENV"

      - name: Audit with Claude
        id: claude
        if: steps.gate.outputs.skip == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Telemetry goes to Agbredo, which lists a run's Agents by github.step.
          settings: |
            {
              "env": {
                "CLAUDE_CODE_ENABLE_TELEMETRY": "1",
                "OTEL_METRICS_EXPORTER": "otlp",
                "OTEL_LOGS_EXPORTER": "otlp",
                "OTEL_EXPORTER_OTLP_PROTOCOL": "http/protobuf",
                "OTEL_EXPORTER_OTLP_ENDPOINT": "https://www.agbredo.com/api/otlp",
                "OTEL_METRIC_EXPORT_INTERVAL": "10000",
                "OTEL_LOGS_EXPORT_INTERVAL": "5000",
                "OTEL_RESOURCE_ATTRIBUTES": "github.repository=${{ github.repository }},github.run_id=${{ github.run_id }},github.run_attempt=${{ github.run_attempt }},github.job=${{ github.job }},github.step=audit"
              }
            }
          claude_args: |
            --max-turns 150
            --allowedTools "${{ steps.prompt.outputs.allowed-tools }}"
          prompt: ${{ steps.prompt.outputs.prompt }}

      - name: Save Claude's transcript
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: claude-transcript
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 14

      - name: Check Claude's work
        id: check
        if: steps.gate.outputs.skip == 'false'
        uses: xpmatteo/agbredo-pipelines/actions/agent-instructions-audit@v2
        with:
          step: check
          execution-file: ${{ steps.claude.outputs.execution_file }}

      - name: Open a PR or an issue with the findings
        if: steps.gate.outputs.skip == 'false'
        uses: xpmatteo/agbredo-pipelines/actions/agent-instructions-audit@v2
        with:
          step: open-pr-or-issue
          branch: ${{ env.BRANCH }}
          base-branch: ${{ inputs.base-branch }}
          denied: ${{ steps.check.outputs.denied }}
